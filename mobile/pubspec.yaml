name: eqohsee
description: "EQOHSEE — HSE & K3 pertambangan"
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # Dipilih menggantikan webview_flutter karena tiga hal yang dipakai
  # EQOHSEE setiap hari tidak ditangani paket bawaan itu: pemilih berkas
  # untuk <input type="file">, unduhan yang memakai Content-Disposition,
  # dan izin kamera dari dalam halaman. Ketiganya bukan tambahan manis —
  # tanpa unggahan, laporan bahaya tidak dapat dikirim dari lapangan.
  flutter_inappwebview: ^6.1.5
  permission_handler: ^11.3.1
  connectivity_plus: ^6.1.0
  url_launcher: ^6.3.1
  shared_preferences: ^2.5.5
  local_auth: ^3.0.1
  quick_actions: ^1.1.0
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/merek.png

  # Huruf yang sama dengan web /lapangan, di-instance dari font variabel
  # di public/fonts (Archivo dan IBM Plex Mono, keduanya SIL OFL).
  # "Archivo Rapat" = Archivo wdth 86, seperti font-stretch: 86% pada
  # .lp-judul di web — judul native dan judul web berbentuk sama.
  fonts:
    - family: Archivo
      fonts:
        - asset: fonts/Archivo-Regular.ttf
          weight: 400
        - asset: fonts/Archivo-SemiBold.ttf
          weight: 600
        - asset: fonts/Archivo-Bold.ttf
          weight: 700
        - asset: fonts/Archivo-ExtraBold.ttf
          weight: 800
    - family: ArchivoRapat
      fonts:
        - asset: fonts/ArchivoRapat-Bold.ttf
          weight: 700
        - asset: fonts/ArchivoRapat-ExtraBold.ttf
          weight: 800
    - family: PlexMono
      fonts:
        - asset: fonts/PlexMono-500.ttf
          weight: 500
        - asset: fonts/PlexMono-600.ttf
          weight: 600
