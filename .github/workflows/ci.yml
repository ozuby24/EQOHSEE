name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  laravel:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Siapkan PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, pdo_pgsql, bcmath, gd, zip
          coverage: none

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Pasang dependensi
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Siapkan lingkungan
        run: |
          cp .env.example .env
          php artisan key:generate
          mkdir -p database && touch database/database.sqlite

      - name: Periksa sintaks seluruh PHP
        run: find app database routes config -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Periksa sintaks seluruh Blade
        run: |
          php -r '
            $gagal = 0;
            $it = new RecursiveIteratorIterator(new RecursiveDirectoryIterator("resources/views"));
            foreach ($it as $f) {
              if ($f->getExtension() !== "php") continue;
              $out = shell_exec("php -l " . escapeshellarg($f->getPathname()) . " 2>&1");
              if (!str_contains($out, "No syntax errors")) { echo $out; $gagal++; }
            }
            exit($gagal ? 1 : 0);
          '

      - name: Migrasi
        run: php artisan migrate --force

      - name: Uji
        run: php artisan test

      # Typecheck dijalankan di sini, bukan disatukan ke skrip `build`.
      # Menyatukannya berarti satu galat tipe menggagalkan penerbitan ke
      # VPS — padahal Vite tidak membutuhkan tsc untuk menghasilkan bundel.
      - name: Siapkan Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Pasang dependensi Node
        run: npm ci

      - name: Periksa tipe TypeScript & Vue
        run: npm run typecheck

      - name: Bangun aset
        run: npm run build
