server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    root /var/www/EQOHSEE/public;
    index index.php index.html index.htm;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss
               application/rss+xml application/json;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    access_log /var/log/nginx/eqohsee.access.log;
    error_log /var/log/nginx/eqohsee.error.log;

    # Tantangan ACME dilayani apa adanya. Memakai `^~` supaya menang atas
    # `location ~ /\.` di bawah: aturan itu mencocokkan setiap alamat yang
    # memuat "/." — termasuk /.well-known/acme-challenge/ — dan menolaknya,
    # sehingga penerbitan lewat webroot gagal tanpa sebab yang jelas.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        allow all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:__PHP_FPM_SOCK__;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
    }

    location ~ /\. {
        deny all;
    }

    location ~ /\.env {
        deny all;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
