server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    root /var/www/EQOHSEE/public;
    index index.php index.html index.htm;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss
               application/rss+xml application/json;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    # X-XSS-Protection sengaja 0, bukan 1.
    #
    # Penyaring XSS bawaan peramban lama justru pernah menjadi jalan
    # serangan tersendiri: ia menebak bagian mana dari halaman yang
    # "berbahaya" lalu menghapusnya, dan tebakan itu dapat diarahkan
    # untuk mematikan skrip yang justru menjaga halaman. Peramban modern
    # sudah membuangnya sama sekali; yang menggantikannya adalah
    # Content-Security-Policy, dipasang aplikasi lengkap dengan nonce
    # per permintaan — sesuatu yang tidak dapat dilakukan dari sini.
    add_header X-XSS-Protection "0" always;

    access_log /var/log/nginx/eqohsee.access.log;
    error_log /var/log/nginx/eqohsee.error.log;

    # Tantangan ACME dilayani apa adanya. Memakai `^~` supaya menang atas
    # `location ~ /\.` di bawah: aturan itu mencocokkan setiap alamat yang
    # memuat "/." — termasuk /.well-known/acme-challenge/ — dan menolaknya,
    # sehingga penerbitan lewat webroot gagal tanpa sebab yang jelas.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        allow all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Berkas unggahan TIDAK PERNAH dijalankan.
    #
    # `^~` mengalahkan SELURUH lokasi regex di bawahnya, termasuk
    # `location ~ \.php$`. Tanpa ini, /storage/ — yang lewat storage:link
    # menunjuk ke storage/app/public — berada di bawah akar web, dan blok
    # PHP itu tidak membedakan berkas aplikasi dari berkas unggahan. Satu
    # berkas .php yang berhasil terunggah karena itu dapat dipanggil
    # sebagai alamat biasa dan dijalankan oleh PHP-FPM, dengan hak akses
    # aplikasi ini. Alamat acaknya pun tidak menyulitkan siapa pun: sistem
    # menampilkannya kembali kepada yang mengunggah.
    #
    # nosniff melengkapi sisanya: berkas yang jenisnya tidak dikenal tidak
    # boleh ditebak sebagai HTML oleh peramban, sebab tebakan itulah yang
    # menjalankan skrip di dalam berkas yang tampaknya gambar.
    location ^~ /storage/ {
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:__PHP_FPM_SOCK__;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
    }

    location ~ /\. {
        deny all;
    }

    location ~ /\.env {
        deny all;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
