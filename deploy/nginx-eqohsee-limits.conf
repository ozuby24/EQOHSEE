# Pembatas laju dan koneksi EQOHSEE — konteks http, bukan server.
#
# Dipasang deploy.sh ke /etc/nginx/conf.d/eqohsee-limits.conf. Berkas
# terpisah karena `limit_req_zone` dan `limit_conn_zone` HANYA sah di
# konteks http; ditaruh di dalam blok server pada vhost, nginx menolak
# seluruh konfigurasinya dan situs tidak menyala sama sekali.
#
# ── Yang dilindungi dan yang TIDAK ──
#
# Yang dilindungi: banjir permintaan dari satu atau beberapa alamat —
# pemindai kerentanan, penebak sandi, bot yang mengambil seluruh situs,
# dan serangan kecil yang bertujuan menghabiskan proses PHP-FPM. Semua
# itu berhenti DI NGINX, sebelum satu proses PHP pun dipakai, dan itu
# perbedaan yang menentukan: nginx melayani ribuan koneksi dengan memori
# beberapa megabita, sedangkan tiap proses PHP-FPM memakan puluhan.
#
# Yang TIDAK dilindungi: banjir besar dari ribuan alamat berbeda
# (DDoS sesungguhnya) dan banjir yang menyumbat pipa jaringan sebelum
# sampai ke mesin ini. Keduanya tidak dapat diselesaikan dari dalam
# server yang sedang dibanjiri — yang menyelesaikannya adalah penyaring
# di depan, seperti Cloudflare, yang menyerap lalu lintasnya di jaringan
# mereka. Berkas ini menaikkan biaya penyerangan; ia tidak membuat situs
# kebal.

# ── Zona umum ──
#
# 30 permintaan/detik per alamat, dengan ledakan 60. Terdengar longgar,
# dan memang harus: satu halaman Inertia menarik dokumennya, berkas
# JS/CSS-nya, font, dan beberapa gambar sekaligus — pembukaan pertama
# sebuah modul dapat menjadi tiga puluhan permintaan dalam satu detik
# dari satu orang yang sama sekali tidak sedang menyerang.
#
# Batas yang terlalu ketat di sini tidak terbaca sebagai perlindungan
# melainkan sebagai situs yang rusak, dan yang pertama mengeluh adalah
# pemakainya sendiri, bukan penyerangnya.
#
# 10m menampung sekitar 160 ribu alamat.
limit_req_zone $binary_remote_addr zone=eq_umum:10m rate=30r/s;

# ── Zona masuk ──
#
# Halaman masuk, daftar, dan atur ulang sandi. Jauh lebih ketat sebab
# tidak ada orang sungguhan yang mengirim formulir masuk sepuluh kali
# dalam semenit — yang melakukannya adalah penebak sandi.
#
# Aplikasinya sendiri sudah membatasi ini (RateLimiter 'masuk',
# 'daftar', 'lupa-sandi'), dan lapisan ini TIDAK menggantikannya. Yang
# ditambahkannya satu hal: batas aplikasi baru dihitung sesudah Laravel
# dijalankan — sesi dibuka, basis data disentuh, kerangka dimuat.
# Penebak yang mengirim ribuan percobaan tetap menghabiskan proses PHP
# meski seluruhnya ditolak. Di sini ia ditolak sebelum PHP tersentuh.
limit_req_zone $binary_remote_addr zone=eq_masuk:10m rate=12r/m;

# ── Koneksi serentak ──
#
# Menahan pola yang tidak terlihat oleh batas laju: membuka banyak
# koneksi lalu membiarkannya menggantung. Permintaannya sedikit,
# lajunya rendah, tetapi tiap koneksi memegang satu slot pekerja.
limit_conn_zone $binary_remote_addr zone=eq_konek:10m;

# 429, bukan 503. 503 berarti "server sedang bermasalah" dan mengundang
# percobaan ulang; 429 menyebut apa adanya — permintaannya terlalu
# sering — dan itu yang dibaca benar oleh pustaka klien maupun mesin
# pencari.
limit_req_status 429;
limit_conn_status 429;

# Yang ditolak dicatat sebagai peringatan, bukan galat: baris ini
# dipakai fail2ban (lihat deploy/fail2ban-eqohsee.conf) dan dibaca orang
# saat memeriksa apakah batasnya terlalu ketat.
limit_req_log_level warn;

# `server_tokens` SENGAJA TIDAK ADA DI SINI.
#
# Berkas ini dimuat pada konteks `http`, dan di situ pula nginx.conf
# bawaan distribusi menyatakannya. Dua pernyataan pada satu konteks
# bukan sekadar mubazir melainkan FATAL:
#
#   [emerg] "server_tokens" directive is duplicate in
#           /etc/nginx/conf.d/eqohsee-limits.conf:76
#
# dan `nginx -t` yang gagal membuat deploy.sh mengembalikan SELURUH
# konfigurasi baru — vhost beserta zona pembatasnya. Akibatnya bukan
# kehilangan satu baris pengerasan: seluruh pengerasan tidak pernah
# terpasang, pada tiap deploy, tanpa satu pun yang gagal secara
# mencolok. Terlihat pertama kali di produksi pada 15 September 2026.
#
# Penyembunyian versinya tetap dilakukan — di blok `server` tiap vhost,
# konteks yang menimpa nilai http tanpa bertabrakan dengannya. Lihat
# deploy/nginx-eqohsee.conf dan deploy/nginx-eqohsee-ssl.conf.
