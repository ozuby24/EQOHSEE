# Vhost EQOHSEE dengan HTTPS.
#
# Dipakai deploy.sh menggantikan nginx-eqohsee.conf begitu sertifikat
# Let's Encrypt untuk domain utamanya benar-benar ada di disk.
#
# Berkas ini ada supaya blok 443 dijelaskan oleh repo, bukan oleh suntingan
# certbot pada berkas yang setiap deploy ditulis ulang. Sebelumnya vhost-nya
# selalu dibangkitkan dari templat yang hanya mengenal port 80; certbot
# menambahkan blok 443 ke berkas yang sama, lalu deploy berikutnya menimpanya.
# Tidak ada yang mendengarkan di 443 lagi, dan peramban yang sudah pernah
# dialihkan ke https menerima ERR_CONNECTION_REFUSED — bukan galat aplikasi,
# jadi lognya bersih dan penyebabnya tidak terlihat dari sisi Laravel.
#
# Penanda: __SERVER_NAME__, __PHP_FPM_SOCK__, __DOMAIN__.

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    # Versi nginx tidak diumumkan pada tanggapan maupun halaman galat.
    # Di sini, pada konteks `server`, BUKAN pada zona pembatas di konteks
    # `http`: di sana ia bertabrakan dengan pernyataan nginx.conf bawaan
    # distribusi dan menjatuhkan seluruh konfigurasi. Lihat catatan
    # panjang pada deploy/nginx-eqohsee-limits.conf.
    server_tokens off;


    # Tantangan ACME harus tetap terlayani lewat polos HTTP, termasuk saat
    # perpanjangan otomatis. Dipasang sebelum pengalihan, dan memakai `^~`
    # supaya menang atas `location ~ /\.` di bawah — aturan itu mencocokkan
    # setiap alamat yang memuat "/." dan akan menolak /.well-known juga.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # HTTP/2 ditulis sebagai parameter `listen`, bukan direktif `http2 on;`.
    # Bentuk direktif baru ada sejak nginx 1.25.1, sementara Ubuntu 24.04
    # membawa 1.24, Debian 12 membawa 1.22, dan Ubuntu 22.04 membawa 1.18 —
    # pada semuanya `http2 on;` ditolak sebagai perintah tak dikenal dan
    # seluruh vhost gagal dimuat. Bentuk parameter ini berlaku sejak 1.9.5
    # dan masih dilayani versi baru.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __SERVER_NAME__;

    # Versi nginx tidak diumumkan pada tanggapan maupun halaman galat.
    # Di sini, pada konteks `server`, BUKAN pada zona pembatas di konteks
    # `http`: di sana ia bertabrakan dengan pernyataan nginx.conf bawaan
    # distribusi dan menjatuhkan seluruh konfigurasi. Lihat catatan
    # panjang pada deploy/nginx-eqohsee-limits.conf.
    server_tokens off;


    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/EQOHSEE/public;
    index index.php index.html index.htm;

    # Berkas cetak audit memuat lampiran; bawaan nginx 1 MB terlalu kecil.
    client_max_body_size 32M;

    # ── Timeout: menahan koneksi yang sengaja diperlambat ──
    #
    # Slowloris membuka banyak koneksi lalu mengirim tajuknya sebit demi
    # sebit, tidak pernah selesai. Permintaannya tidak pernah utuh,
    # sehingga batas laju tidak pernah menghitungnya — sementara tiap
    # koneksi menahan satu slot pekerja. Bawaan nginx 60 detik memberi
    # penyerangnya waktu semenit per koneksi; di bawah ini ia punya
    # limabelas detik.
    #
    # Yang mengunggah berkas besar tidak terganggu: client_body_timeout
    # dihitung antar-potongan, bukan untuk seluruh unggahan.
    client_header_timeout 15s;
    client_body_timeout   15s;
    send_timeout          20s;
    keepalive_timeout     30s;

    # Koneksi serentak per alamat — lihat deploy/nginx-eqohsee-limits.conf.
    limit_conn eq_konek 24;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss
               application/rss+xml application/json;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    # X-XSS-Protection sengaja 0, bukan 1.
    #
    # Penyaring XSS bawaan peramban lama justru pernah menjadi jalan
    # serangan tersendiri: ia menebak bagian mana dari halaman yang
    # "berbahaya" lalu menghapusnya, dan tebakan itu dapat diarahkan
    # untuk mematikan skrip yang justru menjaga halaman. Peramban modern
    # sudah membuangnya sama sekali; yang menggantikannya adalah
    # Content-Security-Policy, dipasang aplikasi lengkap dengan nonce
    # per permintaan — sesuatu yang tidak dapat dilakukan dari sini.
    add_header X-XSS-Protection "0" always;

    # Sengaja tanpa Strict-Transport-Security. HSTS membuat peramban menolak
    # kembali ke HTTP selama masa berlakunya — bagus ketika HTTPS-nya stabil,
    # tetapi situs ini baru saja kehilangan blok 443-nya sekali, dan dengan
    # HSTS aktif kejadian serupa berarti situsnya tidak dapat dibuka sama
    # sekali, bukan sekadar turun ke HTTP. Dinyalakan setelah beberapa deploy
    # membuktikan blok 443-nya bertahan.

    access_log /var/log/nginx/eqohsee.access.log;
    error_log /var/log/nginx/eqohsee.error.log;

    location / {
        # Ledakan 60 dengan nodelay: yang di dalam ledakan dilayani
        # SEKARANG, tidak diantre. Tanpa nodelay, pembukaan halaman yang
        # wajar pun terasa tersendat justru karena perlindungannya.
        limit_req zone=eq_umum burst=60 nodelay;

        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Halaman masuk dan pemulihan sandi ──
    #
    # Disebut satu per satu, bukan lewat pola: alamat yang kebetulan
    # mengandung kata "login" tidak boleh ikut terbatasi, dan yang
    # sungguh perlu dibatasi tidak boleh terlewat karena namanya tidak
    # cocok pola.
    location ~ ^/(login|register|forgot-password|reset-password|two-factor-challenge)$ {
        limit_req zone=eq_masuk burst=5 nodelay;

        try_files $uri /index.php?$query_string;
    }

    # ── Jalur yang hanya diminta pemindai ──
    #
    # Tidak satu pun ada di aplikasi ini, dan tidak satu pun pernah
    # diminta pemakai sungguhan. 444 memutus koneksi tanpa menjawab:
    # lebih murah daripada 404 yang tetap menyusun halaman, dan tidak
    # memberi pemindainya tanda bahwa ia sedang diperiksa.
    location ~* ^/(wp-admin|wp-login|wordpress|xmlrpc\.php|phpmyadmin|pma|adminer|\.git|\.svn|vendor/phpunit) {
        access_log off;
        return 444;
    }

    # Berkas unggahan TIDAK PERNAH dijalankan.
    #
    # `^~` mengalahkan SELURUH lokasi regex di bawahnya, termasuk
    # `location ~ \.php$`. Tanpa ini, /storage/ — yang lewat storage:link
    # menunjuk ke storage/app/public — berada di bawah akar web, dan blok
    # PHP itu tidak membedakan berkas aplikasi dari berkas unggahan. Satu
    # berkas .php yang berhasil terunggah karena itu dapat dipanggil
    # sebagai alamat biasa dan dijalankan oleh PHP-FPM, dengan hak akses
    # aplikasi ini. Alamat acaknya pun tidak menyulitkan siapa pun: sistem
    # menampilkannya kembali kepada yang mengunggah.
    #
    # nosniff melengkapi sisanya: berkas yang jenisnya tidak dikenal tidak
    # boleh ditebak sebagai HTML oleh peramban, sebab tebakan itulah yang
    # menjalankan skrip di dalam berkas yang tampaknya gambar.
    location ^~ /storage/ {
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:__PHP_FPM_SOCK__;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTPS on;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_read_timeout 120s;
    }

    location ~ /\. {
        deny all;
    }

    location ~ /\.env {
        deny all;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
