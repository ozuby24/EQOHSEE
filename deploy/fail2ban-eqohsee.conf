# fail2ban untuk EQOHSEE — OPSIONAL, dipasang sendiri.
#
# Sengaja TIDAK dipasang otomatis oleh deploy.sh. Perkakas ini memblokir
# alamat di tingkat firewall, dan alamat yang salah terblokir menutup
# situs bagi orang yang sungguh berhak — termasuk, kalau sedang apes,
# alamat yang dipakai mengurus servernya sendiri. Pemasangan semacam itu
# harus diputuskan orang, bukan terjadi diam-diam saat deploy.
#
# ── Apa yang ditambahkannya ──
#
# Pembatas laju nginx menolak permintaan SATU per satu, dan menolak
# selamanya: penyerang yang mengirim seribu permintaan ditolak seribu
# kali, dan tiap penolakan tetap memakan koneksi, memori, serta satu
# baris log. Fail2ban memutus pola itu — sesudah beberapa kali ditolak,
# alamatnya diblokir di firewall dan paketnya tidak lagi sampai ke nginx
# sama sekali.
#
# ── Memasang ──
#
#   apt-get install -y fail2ban
#   cp deploy/fail2ban-eqohsee.conf /etc/fail2ban/jail.d/eqohsee.local
#   systemctl restart fail2ban
#   fail2ban-client status eqohsee-limit
#
# Membuka alamat yang salah terblokir:
#
#   fail2ban-client set eqohsee-limit unbanip 203.0.113.9
#
# JALANKAN INI LEBIH DULU bila Anda mengurus server lewat SSH dari
# alamat tetap — ia menjaga alamat Anda sendiri tidak pernah terblokir:
#
#   fail2ban-client set eqohsee-limit addignoreip <alamat-anda>

[eqohsee-limit]
enabled  = true
port     = http,https
filter   = nginx-limit-req
logpath  = /var/log/nginx/eqohsee.error.log

# Sepuluh kali ditolak dalam sepuluh menit, lalu diblokir sejam.
#
# Angkanya sengaja tidak galak. Batas laju nginx sudah menahan
# lonjakannya; yang dikerjakan di sini hanya membebaskan nginx dari
# pengulangan yang keras kepala. Ambang yang terlalu rendah akan
# memblokir kantor yang seluruh pegawainya keluar lewat satu alamat NAT
# — dan bagi mereka situsnya tampak mati total, bukan lambat.
findtime = 600
maxretry = 10
bantime  = 3600

# Alamat yang tidak pernah diblokir. localhost wajib: pemeriksaan
# kesehatan dan cron memanggil situsnya dari mesin itu sendiri.
ignoreip = 127.0.0.1/8 ::1
